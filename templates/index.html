<!DOCTYPE html>
<html>
<head>
    <title>Expense Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(135deg, #0f172a, #1e3c72); min-height:100vh;">

<div class="container mt-5">
    <div class="d-flex justify-content-end mb-3">
    <a href="/logout" class="btn btn-danger">Logout</a>
</div>

    <div class="card shadow p-4">

        <h2 class="text-center text-primary">💰 Expense Tracker</h2>

        <hr>

        <!-- ADD EXPENSE FORM -->
        <form action="/add" method="POST" class="row g-2">

            <div class="col-md-4">
                <input type="text" name="title" class="form-control" placeholder="Expense Name" required>
            </div>

            <div class="col-md-3">
                <input type="number" name="amount" class="form-control" placeholder="Amount" required>
            </div>

            <!-- ✅ FIX: MONTH SELECT -->
            <div class="col-md-3">
                <input type="month" name="date" class="form-control" required>
            </div>

            <div class="col-md-2">
                <button class="btn btn-success w-100">Add</button>
            </div>

        </form>

        <hr>

        <h4 class="text-end text-success">Total: ₹{{ total }}</h4>

        <table class="table table-hover mt-3">
            <thead>
                <tr>
                    <th>Expense</th>
                    <th>Amount</th>
                </tr>
            </thead>

            <tbody>
                {% for e in expenses %}
                <tr>
                    <td>{{ e[1] }}</td>
                    <td>₹{{ e[2] }}</td>
                    <td>
                        <a href="/delete/{{ e[0] }}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

        <div class="text-center mt-3">
            <a href="/report" class="btn btn-info">📊 View Report</a>
        </div>

    </div>

</div>

</body>
</html>
